name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The suite deliberately needs neither PyRosetta nor experimental data,
      # so the demo must run from a clean checkout. This catches a packaging
      # mistake — a template or sample file left out of the distribution —
      # that the unit tests would not notice.
      - name: Smoke-test the documented commands
        run: |
          binderscope rank configs/demo.yaml --top 3
          binderscope dashboard configs/demo.yaml
