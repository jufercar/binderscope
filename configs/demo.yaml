# ─────────────────────────────────────────────────────────────────────────────
# Demo configuration — synthetic data, no PyRosetta required
#
#   binderscope rank      configs/demo.yaml --contributions
#   binderscope dashboard configs/demo.yaml
#
# It reads examples/demo_metrics.csv, which is generated by
# examples/generate_demo_metrics.py and is NOT experimental data. Use it to see
# what the ranking and dashboard stages produce; use configs/pdl1_example.yaml
# for a real run.
# ─────────────────────────────────────────────────────────────────────────────

name: demo
description: >
  Synthetic sample data illustrating the ranking and dashboard stages. Values
  are randomly generated with realistic correlations and carry no biological
  meaning.

# No structures ship with the repository, so the scoring stages cannot run from
# this config. `rank` and `dashboard` pick up examples/demo_metrics.csv, which
# already follows the `<name>_metrics.csv` convention for this output directory.
designs: ../examples/designs
output: ../examples

chains:
  target: A
  binder: B

filters:
  - { col: dG,            label: "dG (kcal/mol)", op: "<", value: -20,  enabled: true }
  - { col: sc,            label: "SC",            op: ">", value: 0.65, enabled: true }
  - { col: unsat_hbonds,  label: "BUNS",          op: "<", value: 3,    enabled: true }
  - { col: dSASA,         label: "dSASA (Å²)",    op: ">", value: 1200, enabled: false }
  - { col: Average_i_pTM, label: "i_pTM",         op: ">", value: 0.70, enabled: false }
  - { col: surface_hydro, label: "surf_hydro",    op: "<", value: 0.28, enabled: false }

ranking:
  exclude:
    - { col: dG, op: "<", value: 0 }
  metrics:
    - { col: dG,                  label: dG,            higher_is_better: false, weight: 2.0,
        description: Interface free energy (kcal/mol) }
    - { col: sc,                  label: SC,            higher_is_better: true,  weight: 2.0,
        description: Shape complementarity }
    - { col: Average_i_pTM,       label: i_pTM,         higher_is_better: true,  weight: 2.0,
        description: Interface predicted TM-score }
    - { col: Average_ipSAE,       label: ipSAE,         higher_is_better: true,  weight: 2.0,
        description: Interface predicted aligned error }
    - { col: dSASA,               label: dSASA,         higher_is_better: true,  weight: 1.5,
        description: Buried surface area }
    - { col: packstat,            label: packstat,      higher_is_better: true,  weight: 1.5,
        description: Interface packing quality }
    - { col: unsat_hbonds,        label: BUNS,          higher_is_better: false, weight: 1.5,
        description: Buried unsatisfied hydrogen bonds }
    - { col: n_hbonds,            label: H-bonds,       higher_is_better: true,  weight: 1.0,
        description: Interface hydrogen bonds }
    - { col: surface_hydro,       label: surf_hydro,    higher_is_better: false, weight: 1.0,
        description: Hydrophobic fraction of the binder surface }
    - { col: Average_Binder_pLDDT, label: binder_pLDDT, higher_is_better: true,  weight: 1.0,
        description: Mean binder pLDDT }
